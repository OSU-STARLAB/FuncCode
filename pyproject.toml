[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funcodekan"
version = "1.0.0"
description = "FuncCode-KAN: codebook-based functional compression and hardware-aware quantization for Kolmogorov-Arnold Networks"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Anonymous Authors" }
]
keywords = ["KAN", "Kolmogorov-Arnold Networks", "compression", "quantization", "codebooks", "FPGA"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch",
  "torchvision",
  "numpy",
  "pandas",
  "scikit-learn",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "safetensors", "matplotlib"]
datasets = ["ucimlrepo", "requests", "openpyxl"]

[tool.setuptools.packages.find]
include = ["funcodekan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
